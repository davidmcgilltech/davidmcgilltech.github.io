<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email/Password Authentication Example</title>

  <link rel="stylesheet" href="https://code.getmdl.io/1.1.3/material.orange-indigo.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <script defer src="https://code.getmdl.io/1.1.3/material.min.js"></script>
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/3.6.10/firebase.js"></script>
  <script>
    var config = {
      apiKey: "AIzaSyBOFJtQXhf0EDOtsrMfNAtzaNDGINxnlec",
      authDomain: "vanwezelushers.firebaseapp.com",
      databaseURL: "https://vanwezelushers.firebaseio.com",
      storageBucket: "vanwezelushers.appspot.com",
      messagingSenderId: "36922932024"
    };
    firebase.initializeApp(config);

    function announce(message, isError) {
      var announcer = document.getElementById('auth-announcements');
      if (!announcer) {
        return;
      }
      announcer.textContent = message;
      announcer.setAttribute('data-state', isError ? 'error' : 'ok');
    }

    function setFieldError(fieldId, message) {
      var field = document.getElementById(fieldId);
      if (!field) {
        return;
      }
      if (message) {
        field.setAttribute('aria-invalid', 'true');
        announce(message, true);
      } else {
        field.removeAttribute('aria-invalid');
      }
    }

    function toggleSignIn() {
      if (firebase.auth().currentUser) {
        firebase.auth().signOut();
      } else {
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        if (email.length < 4) {
          setFieldError('email', 'Please enter an email address.');
          document.getElementById('email').focus();
          return;
        }
        if (password.length < 4) {
          setFieldError('password', 'Please enter a password with at least 4 characters.');
          document.getElementById('password').focus();
          return;
        }
        setFieldError('email', '');
        setFieldError('password', '');

        firebase.auth().signInWithEmailAndPassword(email, password).catch(function(error) {
          if (error.code === 'auth/wrong-password') {
            announce('Wrong password.', true);
          } else {
            announce(error.message, true);
          }
          document.getElementById('quickstart-sign-in').disabled = false;
        });
      }
      document.getElementById('quickstart-sign-in').disabled = true;
    }

    function handleSignUp() {
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      if (email.length < 4) {
        setFieldError('email', 'Please enter an email address.');
        document.getElementById('email').focus();
        return;
      }
      if (password.length < 4) {
        setFieldError('password', 'Please enter a password with at least 4 characters.');
        document.getElementById('password').focus();
        return;
      }

      setFieldError('email', '');
      setFieldError('password', '');

      firebase.auth().createUserWithEmailAndPassword(email, password).catch(function(error) {
        if (error.code === 'auth/weak-password') {
          announce('The password is too weak.', true);
        } else {
          announce(error.message, true);
        }
      });
    }

    function sendEmailVerification() {
      firebase.auth().currentUser.sendEmailVerification().then(function() {
        announce('Email verification sent.', false);
      });
    }

    function sendPasswordReset() {
      var email = document.getElementById('email').value;
      firebase.auth().sendPasswordResetEmail(email).then(function() {
        announce('Password reset email sent.', false);
      }).catch(function(error) {
        announce(error.message, true);
      });
    }

    function initApp() {
      firebase.auth().onAuthStateChanged(function(user) {
        document.getElementById('quickstart-verify-email').disabled = true;
        if (user) {
          var emailVerified = user.emailVerified;
          document.getElementById('quickstart-sign-in-status').textContent = 'Signed in';
          document.getElementById('quickstart-sign-in').textContent = 'Sign out';
          document.getElementById('quickstart-account-details').textContent = JSON.stringify(user, null, '  ');
          if (!emailVerified) {
            document.getElementById('quickstart-verify-email').disabled = false;
          }
          announce('Signed in successfully.', false);
        } else {
          document.getElementById('quickstart-sign-in-status').textContent = 'Signed out';
          document.getElementById('quickstart-sign-in').textContent = 'Sign in';
          document.getElementById('quickstart-account-details').textContent = 'null';
          announce('Signed out.', false);
        }
        document.getElementById('quickstart-sign-in').disabled = false;
      });

      document.getElementById('quickstart-sign-in').addEventListener('click', toggleSignIn, false);
      document.getElementById('quickstart-sign-up').addEventListener('click', handleSignUp, false);
      document.getElementById('quickstart-verify-email').addEventListener('click', sendEmailVerification, false);
      document.getElementById('quickstart-password-reset').addEventListener('click', sendPasswordReset, false);
    }

    window.onload = function() {
      initApp();
    };
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="container">
    <header>
      <h1>Firebase Email &amp; Password Authentication</h1>
      <nav class="site-nav" aria-label="Page">
        <ul>
          <li><a href="/">Home</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <p id="auth-help">Enter an email and password to sign in to an existing account or sign up for a new account.</p>
      <div aria-live="polite" aria-atomic="true" id="auth-announcements" role="status"></div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input class="mdl-textfield__input inline-auth-input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" aria-describedby="auth-help">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input class="mdl-textfield__input inline-auth-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" aria-describedby="auth-help">
      </div>

      <p>
        <button type="button" disabled class="mdl-button mdl-js-button mdl-button--raised" id="quickstart-sign-in" name="signin">Sign in</button>
        <button type="button" class="mdl-button mdl-js-button mdl-button--raised" id="quickstart-sign-up" name="signup">Sign up</button>
        <button type="button" class="mdl-button mdl-js-button mdl-button--raised" disabled id="quickstart-verify-email" name="verify-email">Send email verification</button>
        <button type="button" class="mdl-button mdl-js-button mdl-button--raised" id="quickstart-password-reset" name="verify-email">Send password reset email</button>
      </p>

      <section class="quickstart-user-details-container" aria-labelledby="auth-status-heading">
        <h2 id="auth-status-heading">Authentication status</h2>
        <p>Firebase sign-in status: <span id="quickstart-sign-in-status">Unknown</span></p>
        <div>Firebase auth <code>currentUser</code> object value:</div>
        <pre><code id="quickstart-account-details">null</code></pre>
      </section>
    </main>
  </div>
</body>
</html>
